name: Auto-merge Dependabot PRs

# Approves and enables auto-merge for Dependabot patch/minor updates.
# Major version bumps are left for manual review.
#
# Requires these repo settings:
#   - Settings > General > Pull Requests > "Allow auto-merge"
#   - Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests"
# Auto-merge then waits for branch protection (required checks + the approval below).

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip major updates
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: echo "Major update (${{ steps.meta.outputs.dependency-names }}) - leaving for manual review."

      - name: Approve PR
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
